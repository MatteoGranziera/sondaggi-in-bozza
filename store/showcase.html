<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Sondaggi in bozza</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #17221d;
    background: radial-gradient(circle at 18% 22%, #e4f4ec 0, #f3f5f1 55%, #eceee9 100%);
    display: grid; grid-template-columns: 1fr 420px; gap: 64px; align-items: center; padding: 0 88px 0 104px;
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .brand img { width: 52px; height: 52px; }
  .brand span { font-size: 22px; font-weight: 650; }
  h1 { font-size: 44px; line-height: 1.15; margin: 0 0 22px; letter-spacing: -.01em; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { position: relative; padding-left: 30px; margin-bottom: 14px; font-size: 19px; color: #33413a; }
  li::before { content: ""; position: absolute; left: 0; top: .45em; width: 14px; height: 14px; border-radius: 4px; background: #1b8a5a; }
  .fine { margin-top: 34px; font-size: 14px; color: #6b766f; }
  .frame { height: 740px; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 24px 60px rgba(23, 34, 29, .18), 0 2px 6px rgba(23, 34, 29, .08); border: 1px solid #dde2de; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="../icons/128.png" alt=""><span>Sondaggi in bozza</span></div>
    <h1 id="title"></h1>
    <ul id="points"></ul>
    <p class="fine">Progetto indipendente, non affiliato a WhatsApp né a Meta.</p>
  </div>
  <div class="frame"><iframe id="panel" title="Pannello"></iframe></div>
</body>
</html>
